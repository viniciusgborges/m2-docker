name: m2

services:
  nginx:
    image: nginx:${NGINX_VERSION:-1.30}-alpine
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    volumes:
      - ./:/var/www/html
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  app:
    build:
      context: .docker/php
      args:
        PHP_VERSION: ${PHP_VERSION:-8.3}
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    volumes:
      - ./:/var/www/html
      - ./.docker/php/php.ini:/usr/local/etc/php/conf.d/zz-magento.ini:ro
    depends_on:
      db:
        condition: service_healthy
      opensearch:
        condition: service_healthy

  db:
    image: mariadb:${MARIADB_VERSION:-11.4}
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-magento}
      MARIADB_USER: ${DB_USER:-magento}
      MARIADB_PASSWORD: ${DB_PASSWORD:-magento}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.9.0}
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  db-data:
  opensearch-data: